name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - human_equivalent_connector

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: SpireAgent
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SpireAgent/Re-SpireAgent/package-lock.json
      - run: npm ci
        working-directory: SpireAgent/Re-SpireAgent
      - run: npm run check
        working-directory: SpireAgent

  # Exact-game Connector Host tests/builds run in the Connector repository;
  # proprietary STS2 assemblies are never supplied to this consumer CI.
